name: Paper trade

on:
  schedule:
    - cron: "2,32 * * * *"   # every 30 min (GitHub may start runs a few minutes late)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide, settle and rebuild dashboard
        run: python live.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs
          git diff --cached --quiet && exit 0
          git commit -m "Paper trade run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Switch off a day after the 10-day window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json,sys,pandas as pd; s=json.load(open('results/live_state.json')); sys.exit(0 if pd.Timestamp.now(tz='UTC') > pd.Timestamp(s['start']) + pd.Timedelta(days=11) else 1)" \
            && gh workflow disable paper-trade.yml || true
